[package]
authors = ["Takahiro Sato <harehare1110@gmail.com>"]
description = "TUI for mq, a jq-like Markdown processing tool"
documentation = "https://mqlang.org/book/"
edition = "2024"
exclude = ["tests/*", "examples/*", "docs/*", ".github/*"]
keywords = ["markdown", "tui", "terminal"]
license = "MIT"
name = "mq-tui"
readme = "README.md"
repository = "https://github.com/harehare/mq-tui"
version = "0.2.4"

[dependencies]
arboard = {version = "3.6.1", default-features = false}
clap = {version = "4.6.1", features = ["derive"]}
crossterm = {version = "0.29.0", features = ["event-stream", "use-dev-tty"]}
itertools = "0.15.0"
log = "0.4.31"
miette = {version = "7.6.0", features = ["fancy"]}
mq-lang = "0.8.3"
mq-markdown = "0.8.3"
notify-debouncer-mini = "0.7.0"
ratatui = "0.30.0"
serde = {version = "1", features = ["derive"]}
toml = "1.1"
unicode-width = "0.2.2"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true

[package.metadata.binstall]
pkg-fmt = "bin"
pkg-url = "{ repo }/releases/download/v{ version }/mq-tui-{ target }{ binary-ext }"

